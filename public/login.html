<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#1f6f5c">
  <title>Log in · Health Coach</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/login.js"></script>
</head>
<body>
  <div class="site">
    <nav class="site-nav">
      <a class="brand" href="/">
        <span class="mark" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2-5 4 10 2-5h6"/></svg></span>
        Health Coach
      </a>
    </nav>
    <main class="auth-page">
      <div class="card">
        <h2>Welcome back</h2>
        <p>Log in to carry on with your coach.</p>
        <form class="form" id="loginForm" novalidate>
          <div class="form-error" id="err" role="alert" hidden></div>
          <div class="field">
            <label for="email">Email address</label>
            <input type="email" id="email" autocomplete="email" inputmode="email" autocapitalize="none" required>
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" autocomplete="current-password" required>
          </div>
          <button class="btn" type="submit" id="go">Log in</button>
        </form>
        <p class="fine"><strong>Forgot your password?</strong> Ask the person who invited you for a login link. It logs you in and lets you choose a new password.</p>
        <p class="fine">New here? You need a personal invite link to create an account.</p>
      </div>
    </main>
    <footer class="site-foot">Health Coach · an AI coach, not a doctor.</footer>
  </div>
</body>
</html>
